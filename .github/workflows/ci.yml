name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # @xterm/addon-canvas 0.7 declares an xterm 5 peer range, while the
        # application uses xterm 6 and is covered by the production build/QA.
        # npm 7+ otherwise aborts before CI can type-check the actual app.
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (Vite)
        run: npx vite build
        env:
          # Electron builder not needed in CI — just verify Vite+TS compiles cleanly
          CI: true
